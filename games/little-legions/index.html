<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Added to a home screen, the game runs without Safari's bars, which have no script API on iPhone. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Little Legions</title>
<script>
const mobile = matchMedia('(pointer:coarse)').matches;
document.documentElement.classList.toggle('mobile', mobile);
</script>
<style>
@font-face {
    font-family: Tiny5;
    src: url('TemplateData/Tiny5-Regular.ttf') format('truetype');
    font-display: swap;
}
:root {
    color-scheme: dark;
    --canvas: #191b1a;
    --panel: #242424;
    --raised: #30322e;
    --ivory: #faf9e8;
    --muted: #a1aaa1;
    --sage: #b5cb9d;
    --rule: #4f544c;
    --bar-height: 56px;
    background: var(--canvas);
    color: var(--ivory);
    font-family: Tiny5, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
.mobile, .mobile body {
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}
#game {
    width: 100%;
    height: calc(100% - var(--bar-height));
    display: block;
    outline: none;
    touch-action: none;
}
#game:fullscreen, #game:-webkit-full-screen { width: 100vw; height: 100vh; }
#player-bar {
    height: var(--bar-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 3px 20px;
    border-top: 2px solid var(--rule);
    background: var(--panel);
}
#player-title { color: var(--muted); font-size: 22px; }
button {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 48px;
    border: 2px solid var(--rule);
    border-radius: 0;
    background: var(--panel);
    color: var(--ivory);
    padding: 8px 16px;
    font: 22px/1 Tiny5, monospace;
    cursor: pointer;
    box-shadow: 0 4px 0 #101210;
    -webkit-tap-highlight-color: transparent;
}
button:hover:not(:disabled) { background: var(--raised); border-color: var(--muted); }
button:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
button:focus-visible { outline: none; }
button:focus-visible::after {
    content: "";
    position: absolute;
    inset: -6px;
    pointer-events: none;
    background:
        linear-gradient(var(--ivory),var(--ivory)) left top / 12px 2px,
        linear-gradient(var(--ivory),var(--ivory)) left top / 2px 12px,
        linear-gradient(var(--ivory),var(--ivory)) right top / 12px 2px,
        linear-gradient(var(--ivory),var(--ivory)) right top / 2px 12px,
        linear-gradient(var(--ivory),var(--ivory)) left bottom / 12px 2px,
        linear-gradient(var(--ivory),var(--ivory)) left bottom / 2px 12px,
        linear-gradient(var(--ivory),var(--ivory)) right bottom / 12px 2px,
        linear-gradient(var(--ivory),var(--ivory)) right bottom / 2px 12px;
    background-repeat: no-repeat;
}
button:disabled { color: var(--muted); background: var(--raised); cursor: default; box-shadow: none; }
#fullscreen {
    min-height: 48px;
    height: 48px;
    min-width: 184px;
    margin: 0;
    padding: 8px 16px;
    box-shadow: none;
}
#fullscreen:focus-visible::after { inset: -3px; }
#fullscreen svg { width: 24px; height: 24px; shape-rendering: crispEdges; flex: none; }
#loading, #rotate {
    position: fixed;
    inset: 0 0 var(--bar-height);
    z-index: 1;
    display: grid;
    place-content: center;
    padding: 24px;
    background: var(--canvas);
    text-align: center;
}
.loading-panel {
    position: relative;
    max-width: 640px;
    padding: 48px;
    background: var(--panel);
    box-shadow: 4px 4px 0 #101210;
}
.loading-panel::before, .loading-panel::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    pointer-events: none;
}
.loading-panel::before { left: 0; top: 0; border-left: 2px solid var(--ivory); border-top: 2px solid var(--ivory); }
.loading-panel::after { right: 0; bottom: 0; border-right: 2px solid var(--ivory); border-bottom: 2px solid var(--ivory); }
h1 { font-size: clamp(32px, 6vw, 64px); font-weight: 400; line-height: 1; margin: 0 0 16px; }
p { font-size: 22px; line-height: 1.35; color: var(--muted); margin: 8px 0; }
progress {
    display: block;
    width: min(360px, 65vw);
    height: 16px;
    appearance: none;
    border: 4px solid var(--canvas);
    border-radius: 0;
    margin: 32px auto 16px;
    background: var(--canvas);
    accent-color: var(--sage);
}
progress::-webkit-progress-bar { background: var(--canvas); }
progress::-webkit-progress-value { background: var(--sage); }
progress::-moz-progress-bar { background: var(--sage); }
#failure { display: none; max-width: 480px; margin: 24px auto 0; }
#failure button { margin-top: 16px; background: var(--sage); color: var(--canvas); border-color: var(--sage); }
#failure button:hover { background: #cadab9; }
#hint { font-size: 18px; margin-top: 24px; }
#loading[hidden], progress[hidden] { display: none; }
#rotate { display: none; inset: 0; z-index: 3; }
#rotate p { font-size: 28px; color: var(--ivory); }
.mobile body {
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.mobile #game { height: 100%; }
.mobile #player-bar { display: none; }
.mobile #loading { inset: 0; }
@media (orientation: portrait) { .mobile #rotate { display: grid; } }
@media (max-width: 480px) {
    #player-bar { padding-inline: 12px; }
    #player-title { font-size: 18px; }
    #fullscreen { min-width: 148px; font-size: 20px; gap: 8px; }
    .loading-panel { padding: 32px 24px; }
}
@media (forced-colors: active) {
    button:focus-visible { outline: 2px solid Highlight; outline-offset: 3px; }
    button:focus-visible::after { display: none; }
}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Little Legions game"></canvas>
<footer id="player-bar" aria-label="Game display controls">
    <span id="player-title">LITTLE LEGIONS</span>
    <button id="fullscreen" type="button" aria-label="Enter fullscreen" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M9 3H3V9M15 3H21V9M3 15V21H9M21 15V21H15"/></svg>
        <span id="fullscreen-label">FULLSCREEN</span>
    </button>
</footer>
<section id="loading" aria-live="polite">
    <div class="loading-panel">
        <h1>LITTLE LEGIONS</h1>
        <p>Small armies. Clever formations.</p>
        <progress id="progress" max="1" value="0" aria-label="Loading game"></progress>
        <p id="message">Preparing your battlefield...</p>
        <p id="hint">Drag to build · R to rotate</p>
        <div id="failure">
            <p>The game could not start. Try reloading, or play the Windows download.</p>
            <button id="reload" type="button">TRY AGAIN</button>
        </div>
    </div>
</section>
<section id="rotate" role="alert"><p>Turn your phone sideways to play</p></section>
<script>
const canvas = document.getElementById('game');
const loading = document.getElementById('loading');
const progress = document.getElementById('progress');
const message = document.getElementById('message');
const fullscreenButton = document.getElementById('fullscreen');
const fullscreenLabel = document.getElementById('fullscreen-label');
let game = null;
function fail(error) {
    console.error(error);
    loading.hidden = false;
    progress.hidden = true;
    message.textContent = 'Unable to load Little Legions';
    document.getElementById('failure').style.display = 'block';
    fullscreenButton.disabled = true;
}
// Mobile keeps the full viewport, safe-area padding and the existing rotate prompt.
// Its in-game settings retain fullscreen access; the desktop edge bar never overlays them.
const root = document.documentElement;
const requestPageFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function enterMobileFullscreen() {
    if (!requestPageFullscreen || isFullscreen()) return;
    Promise.resolve(requestPageFullscreen.call(root)).then(() => {
        if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
    }).catch(() => {});
}
function syncFullscreen() {
    const active = isFullscreen();
    fullscreenButton.setAttribute('aria-pressed', String(active));
    fullscreenButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
    fullscreenLabel.textContent = active ? 'EXIT FULLSCREEN' : 'FULLSCREEN';
    // Leaving fullscreen with the system back gesture must not strand a phone in the browser's bars.
    if (mobile && !active) document.addEventListener('pointerup', enterMobileFullscreen, { once: true });
}
document.addEventListener('fullscreenchange', syncFullscreen);
document.addEventListener('webkitfullscreenchange', syncFullscreen);
if (mobile) {
    fullscreenButton.hidden = true;
    document.getElementById('hint').textContent = 'Drag to build · Pinch to zoom · Tap Rotate to turn';
    document.addEventListener('pointerup', enterMobileFullscreen, { once: true });
    // A long press on the canvas would otherwise open the browser's image menu.
    document.addEventListener('contextmenu', event => event.preventDefault());
}
document.getElementById('reload').onclick = () => location.reload();
fullscreenButton.onclick = () => {
    if (!game) return;
    if (isFullscreen()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) Promise.resolve(exit.call(document)).catch(() => {});
    } else {
        game.SetFullscreen(1);
    }
    canvas.focus();
};
// Unity captures page keyboard events. Keep the browser control reachable from the canvas.
// Register before the loader, and leave normal button Enter/Space activation to the browser.
function routeDisplayKeys(event) {
    if (mobile || fullscreenButton.disabled) return;
    const onButton = document.activeElement === fullscreenButton;
    if (event.type === 'keydown' && event.key === 'Tab' &&
        (document.activeElement === canvas || onButton)) {
        event.preventDefault();
        event.stopImmediatePropagation();
        if (onButton) canvas.focus();
        else fullscreenButton.focus();
    } else if (onButton) {
        event.stopImmediatePropagation();
        if (event.type === 'keydown' && event.key === 'Escape') {
            event.preventDefault();
            canvas.focus();
        }
    }
}
for (const type of ['keydown', 'keyup', 'keypress']) {
    window.addEventListener(type, routeDisplayKeys, true);
}
// Every full-screen pass costs per backbuffer pixel, so cap how many there are. Pixel art stays crisp
// well below a phone's native density. Pixels per CSS pixel, for the current size of the page.
function renderScale() {
    const cssPixels = Math.max(1, innerWidth * innerHeight);
    const budget = mobile ? 1000000 : 2100000;
    const preferred = mobile ? Math.min(window.devicePixelRatio || 1, 2) : 1;
    return Math.min(preferred, Math.sqrt(budget / cssPixels));
}
// Keeps the budget as the window or orientation changes. Unity reads this every frame.
addEventListener('resize', () => { if (game) game.Module.devicePixelRatio = renderScale(); });
// Stays up after the engine starts, until the first scene's shaders have linked (WebLoadingScreen.cs).
function hideLoading() {
    loading.hidden = true;
    fullscreenButton.disabled = false;
    canvas.focus();
}
window.littleLegionsHideLoading = hideLoading;
const loader = document.createElement('script');
loader.src = 'Build/WebBuild.loader.js';
loader.onerror = () => fail('Game loader could not be downloaded.');
loader.onload = () => createUnityInstance(canvas, {
    dataUrl: 'Build/WebBuild.data.unityweb',
    frameworkUrl: 'Build/WebBuild.framework.js.unityweb',
    codeUrl: 'Build/WebBuild.wasm.unityweb',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'Greenpine Studio',
    productName: 'Little Legions',
    productVersion: '0.1.0',
    devicePixelRatio: renderScale(),
    autoSyncPersistentDataPath: true,
    showBanner: (text, type) => { if (type === 'error') console.error(text); else console.warn(text); }
}, value => {
    progress.value = value;
    message.textContent = 'Loading your legion... ' + Math.round(value * 100) + '%';
}).then(instance => {
    game = instance;
    progress.value = 1;
    message.textContent = 'Preparing your battlefield...';
    // A slow machine still gets the game, even if it never reports in.
    setTimeout(hideLoading, 30000);
}).catch(fail);
document.body.appendChild(loader);
</script>
</body>
</html>
<script defer src="https://static.itch.io/htmlgame.js" type="text/javascript"></script>
