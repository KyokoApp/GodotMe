name: Build KyokoBeat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      export_keystore:
        description: 'Export debug keystore as base64 (run once to get KEYSTORE_BASE64 secret)'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@6

      - name: Add Android platform
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Configure Android (permissions & native plugin)
        run: node scripts/configure-android.cjs

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Inject persistent debug keystore
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.HAS_KEYSTORE != '' }}
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build APK debug
        run: cd android && ./gradlew assembleDebug

      - name: Export debug keystore as base64
        if: ${{ github.event.inputs.export_keystore == 'true' }}
        run: |
          KEYSTORE_PATH=$(find ~ -name "debug.keystore" 2>/dev/null | head -1)
          if [ -z "$KEYSTORE_PATH" ]; then
            KEYSTORE_PATH=$(find /root -name "debug.keystore" 2>/dev/null | head -1)
          fi
          echo "Found keystore at: $KEYSTORE_PATH"
          echo "==== COPY THIS TO KEYSTORE_BASE64 SECRET ===="
          base64 -w 0 "$KEYSTORE_PATH"
          echo ""
          echo "============================================="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KyokoBeat-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
