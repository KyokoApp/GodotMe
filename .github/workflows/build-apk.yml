name: Build KyokoBeat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate keystore
        run: |
          mkdir -p /tmp/keystore-out
          keytool -genkey -v \
            -keystore /tmp/keystore-out/kyokobeat-release.keystore \
            -alias kyokobeat \
            -keyalg RSA -keysize 2048 \
            -validity 36500 \
            -storepass kyokobeat123 \
            -keypass kyokobeat123 \
            -dname "CN=KyokoBeat, O=Kyoko, C=ID"
          base64 -w 0 /tmp/keystore-out/kyokobeat-release.keystore > /tmp/keystore-out/keystore_base64.txt
          echo "✅ Done! Download artifact keystore_base64.txt lalu paste isinya ke secret KEYSTORE_BASE64"

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: /tmp/keystore-out/keystore_base64.txt
          retention-days: 1
