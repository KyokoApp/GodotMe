name: Build KyokoBeat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      export_keystore:
        description: 'Export debug keystore as base64 (run once to get KEYSTORE_BASE64 secret)'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@6

      - name: Add Android platform
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Configure Android (permissions & native plugin)
        run: node scripts/configure-android.cjs

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Inject persistent debug keystore (if secret exists)
      # First time: skip this step, let Android generate a fresh one, then export it
      - name: Inject persistent debug keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build APK debug
        run: cd android && ./gradlew assembleDebug

      # ONLY runs when export_keystore=true (run once manually to get the keystore)
      - name: Export debug keystore as base64
        if: ${{ github.event.inputs.export_keystore == 'true' }}
        run: |
          echo "==== COPY THIS TO KEYSTORE_BASE64 SECRET ===="
          base64 -w 0 ~/.android/debug.keystore
          echo ""
          echo "============================================="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KyokoBeat-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
