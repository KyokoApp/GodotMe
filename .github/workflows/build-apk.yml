name: Build KyokoBeat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@6

      - name: Add Android platform
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Configure Android (permissions & native plugin)
        run: node scripts/configure-android.cjs

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Setup release keystore
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/kyokobeat-release.keystore
          echo "✅ Keystore loaded"

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=kyokobeat123
          keyPassword=kyokobeat123
          keyAlias=kyokobeat
          storeFile=keystore/kyokobeat-release.keystore
          EOF

      - name: Inject signing config into build.gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"

          sed -i '/^android {/i\
          def keystorePropertiesFile = rootProject.file("key.properties")\
          def keystoreProperties = new Properties()\
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\
          ' "$BUILD_GRADLE"

          sed -i '/buildTypes {/i\
              signingConfigs {\
                  release {\
                      keyAlias keystoreProperties["keyAlias"]\
                      keyPassword keystoreProperties["keyPassword"]\
                      storeFile file(keystoreProperties["storeFile"])\
                      storePassword keystoreProperties["storePassword"]\
                  }\
              }\
          ' "$BUILD_GRADLE"

          sed -i '/buildTypes {/,/^    }/ s/release {/release {\n                signingConfig signingConfigs.release/' "$BUILD_GRADLE"

          echo "✅ Signing config injected"

      - name: Build APK release
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KyokoBeat-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
