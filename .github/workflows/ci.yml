name: ci

on:
  push:
    branches: ["arena/5c17933c-godotme"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  # ------------------------------------------------------------ lint/parse ---
  lint:
    name: parse check (all scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GITHUB_WORKSPACE/.tools"
          mv "$GITHUB_WORKSPACE/.tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GITHUB_WORKSPACE/.tools/godot"
          chmod +x "$GITHUB_WORKSPACE/.tools/godot"
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"

      - name: Check every script
        run: |
          set +e
          : > /tmp/lint.log
          godot --headless --path launcher --import >/dev/null 2>&1
          godot --headless --path game --import >/dev/null 2>&1
          for f in $(cd launcher && find . -name "*.gd" | sed 's|^\./||'); do
            echo "--- launcher/$f" >> /tmp/lint.log
            godot --headless --path launcher --check-only --script "res://$f" 2>&1 \
              | grep -v "^Godot Engine" \
              | grep -vE "Identifier not found: (Cfg|Store|Log|Guard|Updater)" >> /tmp/lint.log
          done
          for f in $(cd game && find . -name "*.gd" | sed 's|^\./||'); do
            echo "--- game/$f" >> /tmp/lint.log
            godot --headless --path game --check-only --script "res://$f" 2>&1 | grep -v "^Godot Engine" >> /tmp/lint.log
          done
          cat /tmp/lint.log
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### parse check"; echo '```'; tail -c 60000 /tmp/lint.log; echo '```'; } > /tmp/lint.md
            gh pr comment "$PR" --body-file /tmp/lint.md --repo "$GITHUB_REPOSITORY" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ------------------------------------------------- one job per test case ---
  launcher-tests:
    name: test / ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - unit
          - first_install
          - partial_update
          - resume
          - bad_hash
          - offline
          - launcher_too_old
          - blocked
          - signed_ok
          - signed_bad
          - crash
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GITHUB_WORKSPACE/.tools"
          mv "$GITHUB_WORKSPACE/.tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GITHUB_WORKSPACE/.tools/godot"
          chmod +x "$GITHUB_WORKSPACE/.tools/godot"
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"

      - name: Throwaway signing key
        run: |
          mkdir -p launcher/signing
          openssl genrsa -out /tmp/rt_priv.pem 2048 2>/dev/null
          openssl rsa -in /tmp/rt_priv.pem -pubout -out launcher/signing/public_key.pem 2>/dev/null

      - name: Run case
        env:
          GODOT: ${{ github.workspace }}/.tools/godot
          SIGN_KEY: /tmp/rt_priv.pem
          PORT: "8765"
        run: |
          chmod +x tools/run_launcher_tests.sh
          tools/run_launcher_tests.sh ${{ matrix.case }} 2>&1 | tee /tmp/case.log
          exit ${PIPESTATUS[0]}

      - name: Publish case log as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/case.log ]; then echo "no log produced"; exit 0; fi
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -z "$PR" ]; then echo "no PR for $GITHUB_REF_NAME"; exit 0; fi
          {
            echo "### CI log — case \`${{ matrix.case }}\`"
            echo ""
            echo '```'
            tail -c 50000 /tmp/case.log | sed 's/```/``\`/g'
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md --repo "$GITHUB_REPOSITORY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.case }}
          path: /tmp/case.log
          if-no-files-found: warn

  # -------------------------------------------------------- screenshots -----
  screenshots:
    name: screenshots
    runs-on: ubuntu-latest
    needs: [launcher-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GITHUB_WORKSPACE/.tools"
          mv "$GITHUB_WORKSPACE/.tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GITHUB_WORKSPACE/.tools/godot"
          chmod +x "$GITHUB_WORKSPACE/.tools/godot"
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"

      - name: Install software GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils

      - name: Capture
        env:
          GODOT: ${{ github.workspace }}/.tools/godot
          SIGN_KEY: /tmp/rt_priv.pem
          PORT: "8765"
          CAPTURES: ${{ github.workspace }}/docs/screenshots
        run: |
          mkdir -p docs/screenshots
          timeout 240 "$GODOT" --headless --path launcher --import 2>&1 | tail -3
          timeout 240 "$GODOT" --headless --path game --import 2>&1 | tail -3
          timeout -k 5 180 "$GODOT" --headless --path launcher res://tests/FixtureBuilder.tscn -- \
              --game-dir="$PWD/game" --out=/tmp/rt_fixtures 2>&1 | tail -5
          python3 tools/testserver.py --root /tmp/rt_fixtures --port $PORT >/tmp/cap_server.log 2>&1 &
          SRV=$!
          sleep 2
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GITHUB_WORKSPACE/.tools/godot" --path launcher --resolution 1280x720 \
            res://tests/TestRunner.tscn -- --scenario=capture --data-root=user://t_capture \
            --budget=120 --manifest=http://127.0.0.1:$PORT/slow.json \
            --captures="$GITHUB_WORKSPACE/docs/screenshots" 2>&1 | tail -40
          kill $SRV 2>/dev/null || true
          ls -la docs/screenshots

      - name: Commit screenshots
        run: |
          git config user.name "arena-ci"
          git config user.email "ci@arena.ai"
          git add -A docs/screenshots
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
          else
            git commit -m "docs: tangkapan layar launcher (CI) [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: warn

  # ----------------------------------------------------------------- apk ----
  android-apk:
    name: build launcher APK
    runs-on: ubuntu-latest
    needs: [launcher-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GITHUB_WORKSPACE/.tools"
          mv "$GITHUB_WORKSPACE/.tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GITHUB_WORKSPACE/.tools/godot"
          chmod +x "$GITHUB_WORKSPACE/.tools/godot"
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"

      - name: Install export templates
        run: |
          mkdir -p /tmp/tpl
          curl -sSL -o /tmp/tpl.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          cp -r /tmp/tpl/templates/* "$DEST"/
          ls "$DEST" | head

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android SDK pieces
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" | tail -3
          yes | sdkmanager --licenses >/dev/null || true

      - name: Debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore /tmp/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Export APK
        run: |
          set +e
          : > /tmp/apk.log
          timeout 240 godot --headless --path launcher --import >> /tmp/apk.log 2>&1
          mkdir -p dist
          godot --headless --path launcher --export-debug "Android" \
            "$PWD/dist/re-traveller-launcher.apk" >> /tmp/apk.log 2>&1
          code=$?
          tail -60 /tmp/apk.log
          ls -la dist >> /tmp/apk.log
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### APK export log (exit $code)"; echo '```'; tail -c 60000 /tmp/apk.log; echo '```'; } > /tmp/apk.md
            gh pr comment "$PR" --body-file /tmp/apk.md --repo "$GITHUB_REPOSITORY" || true
          fi
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: re-traveller-launcher-apk
          path: dist/*.apk
          if-no-files-found: error
