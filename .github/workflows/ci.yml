name: ci

on:
  push:
    # any Arena work branch, plus main, so a merged change keeps being checked
    branches: ["main", "arena/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  # ------------------------------------------------------------ lint/parse ---
  lint:
    name: parse check (all scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GITHUB_WORKSPACE/.tools"
          mv "$GITHUB_WORKSPACE/.tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GITHUB_WORKSPACE/.tools/godot"
          chmod +x "$GITHUB_WORKSPACE/.tools/godot"
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"

      - name: Check every script
        run: |
          set +e
          : > /tmp/lint.log
          # cheap first: a duplicated function name costs a 5 minute Godot
          # round trip to discover otherwise
          python3 tools/gd_dup_check.py | tee -a /tmp/lint.log
          DUP_FAILED=${PIPESTATUS[0]}
          godot --headless --path launcher --import >/dev/null 2>&1
          godot --headless --path game --import >/dev/null 2>&1
          for f in $(cd launcher && find . -name "*.gd" | sed 's|^\./||'); do
            echo "--- launcher/$f" >> /tmp/lint.log
            godot --headless --path launcher --check-only --script "res://$f" 2>&1 \
              | grep -v "^Godot Engine" \
              | grep -vE "Identifier not found: (Cfg|Store|Log|Guard|Updater)" >> /tmp/lint.log
          done
          for f in $(cd game && find . -name "*.gd" | sed 's|^\./||'); do
            echo "--- game/$f" >> /tmp/lint.log
            godot --headless --path game --check-only --script "res://$f" 2>&1 | grep -v "^Godot Engine" >> /tmp/lint.log
          done
          cat /tmp/lint.log
          # --check-only cannot resolve autoloads, so "Compilation failed" noise
          # is expected; a real Parse Error never appears in a clean run.
          if grep -qE "Parse Error|Failed to parse" /tmp/lint.log; then
            echo "LINT FAILED: parse error in a GDScript file"
            grep -nE "Parse Error|Failed to parse" /tmp/lint.log
            # Annotations are also the only part of this log that can be read
            # back from the API: the full job log lives on blob storage, which a
            # phone (and the sandbox) cannot always reach.
            n=0
            while IFS= read -r line; do
              n=$((n + 1))
              [ "$n" -gt 25 ] && break
              echo "::error::${line}"
            done < <(grep -E "Parse Error|Failed to parse" /tmp/lint.log | head -25)
            LINT_FAILED=1
          fi
          if [ "${DUP_FAILED:-0}" -ne 0 ]; then
            echo "LINT FAILED: duplicate function definition"
            LINT_FAILED=1
          fi
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### parse check"; echo '```'; tail -c 60000 /tmp/lint.log; echo '```'; } > /tmp/lint.md
            gh pr comment "$PR" --body-file /tmp/lint.md --repo "$GITHUB_REPOSITORY" || true
          fi
          exit ${LINT_FAILED:-0}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Play rules (flinch hands control back, props stand on the ground)
        # Headless, no GPU: these are rules about the state machine and about
        # geometry, and both of them failed on a real phone while every static
        # check stayed green.
        run: |
          set -o pipefail
          # keep the transcript visible even when the rules fail: a red step with
          # no log in the PR is useless on a phone-sized screen
          set +e
          godot --headless --path game res://game/tests/PlayTest.tscn 2>&1 | tee /tmp/play.log
          code=${PIPESTATUS[0]}
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### play rules (exit $code)"; echo '```'; tail -c 20000 /tmp/play.log; echo '```'; } > /tmp/play.md
            gh pr comment "$PR" --body-file /tmp/play.md --repo "$GITHUB_REPOSITORY" || true
          fi
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Story rules (save versions + dialogue branches)
        # Headless: saving, migrating and picking the right conversation are all
        # invisible in a screenshot, and losing a save is the worst bug this
        # game could ship.
        run: |
          set -o pipefail
          set +e
          : > /tmp/story.log
          godot --headless --path game res://game/tests/SaveTest.tscn 2>&1 | tee -a /tmp/story.log
          save_code=${PIPESTATUS[0]}
          godot --headless --path game res://game/tests/DialogueTest.tscn 2>&1 | tee -a /tmp/story.log
          dlg_code=${PIPESTATUS[0]}
          code=$(( save_code + dlg_code ))
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### story rules (exit $code)"; echo '```'; tail -c 20000 /tmp/story.log; echo '```'; } > /tmp/story.md
            gh pr comment "$PR" --body-file /tmp/story.md --repo "$GITHUB_REPOSITORY" || true
          fi
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Pack audit (no dead weight in the six packages)
        # Phase 7 found a 1,17 MB backdrop packed twice and loaded by nothing.
        # This fails the build when an asset is packed but never referenced, or
        # when a path in FixtureBuilder no longer exists.
        run: python3 tools/pack_audit.py

      - name: World rules (day cycle + atmosphere)
        # Headless: light is exactly what a screenshot cannot check. Noon must be
        # brighter than midnight, the cottage lamp must be off at noon, and a
        # firefly in the afternoon is a bug.
        run: |
          set -o pipefail
          set +e
          godot --headless --path game res://game/tests/WorldTest.tscn 2>&1 | tee /tmp/world.log
          code=${PIPESTATUS[0]}
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### world rules (exit $code)"; echo '```'; tail -c 20000 /tmp/world.log; echo '```'; } > /tmp/world.md
            gh pr comment "$PR" --body-file /tmp/world.md --repo "$GITHUB_REPOSITORY" || true
          fi
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}

      - name: UI rules (icons, settings, menu)
        # Headless: a screenshot of the menu proves it looks right, not that its
        # buttons do anything. These checks press them.
        run: |
          set -o pipefail
          set +e
          godot --headless --path game res://game/tests/UiTest.tscn 2>&1 | tee /tmp/ui.log
          code=${PIPESTATUS[0]}
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### ui rules (exit $code)"; echo '```'; tail -c 20000 /tmp/ui.log; echo '```'; } > /tmp/ui.md
            gh pr comment "$PR" --body-file /tmp/ui.md --repo "$GITHUB_REPOSITORY" || true
          fi
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Field rules (camera leash, minimap, action button, fog)
        # Headless: a screenshot shows that the field looks empty, not that the
        # camera stops at the map edge, that the minimap survives a bigger map,
        # that the button follows distance, or that fog survives a save.
        run: |
          set -o pipefail
          set +e
          godot --headless --path game res://game/tests/FieldTest.tscn 2>&1 | tee /tmp/field.log
          code=${PIPESTATUS[0]}
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### field rules (exit $code)"; echo '```'; tail -c 20000 /tmp/field.log; echo '```'; } > /tmp/field.md
            gh pr comment "$PR" --body-file /tmp/field.md --repo "$GITHUB_REPOSITORY" || true
          fi
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Camera rules (fixed lens, smooth follow, occlusion)
        # Headless: the bug this step fixes was "the camera zooms by itself", and
        # only a frame-by-frame recording of pitch, FOV and distance can prove it
        # stopped. A screenshot cannot.
        run: |
          set -o pipefail
          set +e
          godot --headless --path game res://game/tests/CameraTest.tscn 2>&1 | tee /tmp/camera.log
          code=${PIPESTATUS[0]}
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### camera rules (exit $code)"; echo '```'; tail -c 20000 /tmp/camera.log; echo '```'; } > /tmp/camera.md
            gh pr comment "$PR" --body-file /tmp/camera.md --repo "$GITHUB_REPOSITORY" || true
          fi
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Building rules (3B - kit, atlas, footing, collision, occlusion)
        # Headless: a screenshot shows a village that looks right, not that every
        # cell name in the kit exists in the atlas, that a house stands on the
        # lowest corner of its slope instead of floating over it, that a cottage
        # is still one mesh and one material, or that the village fits a phone's
        # triangle budget.
        run: |
          set -o pipefail
          set +e
          : > /tmp/building.log
          # pillow only for the "is the PNG the size the manifest claims" check
          python3 -m venv /tmp/kitvenv >/dev/null 2>&1 || true
          /tmp/kitvenv/bin/pip install --quiet pillow 2>/dev/null \
            || /tmp/kitvenv/bin/pip install --quiet --break-system-packages pillow
          /tmp/kitvenv/bin/python tools/kit_audit.py 2>&1 | tee -a /tmp/building.log
          kit_code=${PIPESTATUS[0]}
          godot --headless --path game res://game/tests/BuildingTest.tscn 2>&1 | tee -a /tmp/building.log
          build_code=${PIPESTATUS[0]}
          code=$(( kit_code + build_code ))
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### building rules (exit $code)"; echo '```'; tail -c 30000 /tmp/building.log; echo '```'; } > /tmp/building.md
            gh pr comment "$PR" --body-file /tmp/building.md --repo "$GITHUB_REPOSITORY" || true
          fi
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Battle rules (3C - tables, engine, 1000 battles)
        # Headless, and it has to be: a screenshot of a menu proves the words are
        # spelled right, not that a shield really runs out, that a broken enemy
        # loses its turn, that BP is spent exactly once, that a boss's second
        # phase opens a new weakness, or that a battle using Break + Boost ends in
        # 5-8 turns while one that ignores them does not.
        run: |
          set -o pipefail
          set +e
          godot --headless --path game res://game/tests/BattleTest.tscn 2>&1 | tee /tmp/battle.log
          code=${PIPESTATUS[0]}
          # The full job log lives on blob storage, which is not always reachable
          # from a phone (or from the sandbox that wrote this). Annotations are:
          # the engine's own errors and the failing checks go up as `::error::`.
          {
            grep -E "SCRIPT ERROR|ERROR:|WARNING:" /tmp/battle.log | head -14
            grep -E "\[BATTLE\] (FAIL|simulasi|data:)" /tmp/battle.log | head -14
            tail -5 /tmp/battle.log
          } | sed 's/^/::error::/' || true
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### battle rules (exit $code)"; echo '```'; tail -c 30000 /tmp/battle.log; echo '```'; } > /tmp/battle.md
            gh pr comment "$PR" --body-file /tmp/battle.md --repo "$GITHUB_REPOSITORY" || true
          fi
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Region rules (Yaros - reachability, seams, streaming, travel)
        # Headless: a screenshot proves the region looks finished, not that the
        # mountain gate is reachable, that no terrace is a trap, that two chunks
        # meet without a crack, that a teleport loads in time, or that the walk
        # from the village really takes two minutes.
        run: |
          set -o pipefail
          set +e
          godot --headless --path game res://game/tests/RegionTest.tscn 2>&1 | tee /tmp/region.log
          code=${PIPESTATUS[0]}
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### region rules (exit $code)"; echo '```'; tail -c 20000 /tmp/region.log; echo '```'; } > /tmp/region.md
            gh pr comment "$PR" --body-file /tmp/region.md --repo "$GITHUB_REPOSITORY" || true
          fi
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Character sprite contract (strips + SpriteFrames)
        # Fails the build, it does not guess: a strip whose width is not
        # frames x frame_width, a stale pivot or an empty animation stops here.
        run: |
          set -o pipefail
          python3 -m venv /tmp/venv >/dev/null
          /tmp/venv/bin/pip install --quiet pillow
          /tmp/venv/bin/python tools/import_character_sprites.py --check 2>&1 | tee /tmp/chars_py.log
          godot --headless --path game res://game/tests/ValidateCharacters.tscn 2>&1 | tee /tmp/chars_gd.log
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### character contract"; echo '```'; tail -c 20000 /tmp/chars_py.log; echo; tail -c 20000 /tmp/chars_gd.log; echo '```'; } > /tmp/chars.md
            gh pr comment "$PR" --body-file /tmp/chars.md --repo "$GITHUB_REPOSITORY" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ------------------------------------------------- one job per test case ---
  launcher-tests:
    name: test / ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - unit
          - first_install
          - partial_update
          - resume
          - bad_hash
          - offline
          - launcher_too_old
          - blocked
          - signed_ok
          - signed_bad
          - ui_input
          - boot_packs
          - crash
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GITHUB_WORKSPACE/.tools"
          mv "$GITHUB_WORKSPACE/.tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GITHUB_WORKSPACE/.tools/godot"
          chmod +x "$GITHUB_WORKSPACE/.tools/godot"
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"

      - name: Throwaway signing key
        run: |
          mkdir -p launcher/signing
          openssl genrsa -out /tmp/rt_priv.pem 2048 2>/dev/null
          openssl rsa -in /tmp/rt_priv.pem -pubout -out launcher/signing/public_key.pem 2>/dev/null

      - name: Run case
        env:
          GODOT: ${{ github.workspace }}/.tools/godot
          SIGN_KEY: /tmp/rt_priv.pem
          PORT: "8765"
        run: |
          chmod +x tools/run_launcher_tests.sh
          tools/run_launcher_tests.sh ${{ matrix.case }} 2>&1 | tee /tmp/case.log
          exit ${PIPESTATUS[0]}

      - name: Publish case log as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/case.log ]; then echo "no log produced"; exit 0; fi
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -z "$PR" ]; then echo "no PR for $GITHUB_REF_NAME"; exit 0; fi
          {
            echo "### CI log — case \`${{ matrix.case }}\`"
            echo ""
            echo '```'
            tail -c 50000 /tmp/case.log | sed 's/```/``\`/g'
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md --repo "$GITHUB_REPOSITORY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.case }}
          path: /tmp/case.log
          if-no-files-found: warn

  # -------------------------------------------------------- screenshots -----
  screenshots:
    name: screenshots
    runs-on: ubuntu-latest
    # A capture run that hangs used to hold this job for the default six hours.
    # Forty minutes is many times the real cost (~12) and still bounded.
    timeout-minutes: 40
    needs: [launcher-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GITHUB_WORKSPACE/.tools"
          mv "$GITHUB_WORKSPACE/.tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GITHUB_WORKSPACE/.tools/godot"
          chmod +x "$GITHUB_WORKSPACE/.tools/godot"
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"

      - name: Install software GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils

      - name: Capture
        env:
          GODOT: ${{ github.workspace }}/.tools/godot
          SIGN_KEY: /tmp/rt_priv.pem
          PORT: "8765"
          CAPTURES: ${{ github.workspace }}/docs/screenshots
        run: |
          mkdir -p docs/screenshots
          timeout 240 "$GODOT" --headless --path launcher --import 2>&1 | tail -3
          timeout 240 "$GODOT" --headless --path game --import 2>&1 | tail -3
          timeout -k 5 180 "$GODOT" --headless --path launcher res://tests/FixtureBuilder.tscn -- \
              --game-dir="$PWD/game" --out=/tmp/rt_fixtures 2>&1 | tail -5
          python3 tools/testserver.py --root /tmp/rt_fixtures --port $PORT >/tmp/cap_server.log 2>&1 &
          SRV=$!
          sleep 2
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GITHUB_WORKSPACE/.tools/godot" --path launcher --resolution 1280x720 \
            res://tests/TestRunner.tscn -- --scenario=capture --data-root=user://t_capture \
            --budget=120 --manifest=http://127.0.0.1:$PORT/slow.json \
            --captures="$GITHUB_WORKSPACE/docs/screenshots" 2>&1 | tee /tmp/capture.log | tail -40
          # --- the phone's own path: the real game loaded out of the six packs --
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GITHUB_WORKSPACE/.tools/godot" --path launcher --resolution 1280x720 \
            res://tests/TestRunner.tscn -- --scenario=boot_packs --budget=120 \
            --data-root=user://t_bootshot --manifest=http://127.0.0.1:$PORT/v100.json \
            --captures="$GITHUB_WORKSPACE/docs/screenshots" \
            2>&1 | tee -a /tmp/capture.log | tail -30
          kill $SRV 2>/dev/null || true
          # the screen the player actually lands on after tapping MAIN
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 1280x720 \
            -- --capture="$GITHUB_WORKSPACE/docs/screenshots" --capture-name=08_diorama \
            2>&1 | tee -a /tmp/capture.log | tail -20
          # --- step 1: the field, the banner, the dialogue, the menu, the map,
          # --- the fog, and the same field at three screen ratios -------------
          # Each run goes through the real game (Main.tscn) and the same doors a
          # thumb uses; nothing is drawn by a test-only path.
          for variant in "menu:lanjut 20_menu" "menu:pengaturan 21_pengaturan" \
                         "field 22_lapangan" "field_only 22b_lapangan_kosong" "stick 22c_stik" \
                         "banner 23_banner" \
                         "dialogue 24_dialog" "menu:jurnal 25_jurnal" \
                         "map 26_peta" "fog 27_fog"; do
            arg="${variant% *}"; name="${variant#* }"
            case "$arg" in
              menu:*) extra="--menu=${arg#menu:}" ;;
              *) extra="--hud=$arg" ;;
            esac
            xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
              "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 1280x720 \
              -- $extra --walk=1.2 --capture="$GITHUB_WORKSPACE/docs/screenshots" \
              --capture-name="$name" 2>&1 | tee -a /tmp/capture.log | tail -12
          done
          # the same HUD at 20:9 and 4:3, to prove nothing drifts or overlaps
          for variant in "1440x648 28_rasio_20x9" "960x720 29_rasio_4x3"; do
            set -- $variant
            screen="${1%x*}"
            xvfb-run -a -s "-screen 0 ${1}x24" env LIBGL_ALWAYS_SOFTWARE=1 \
              "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution "$1" \
              -- --hud=field --walk=1.2 \
              --capture="$GITHUB_WORKSPACE/docs/screenshots" \
              --capture-name="$2" 2>&1 | tee -a /tmp/capture.log | tail -12
            echo "ratio capture $1 -> $2 (screen width $screen)"
          done
          # --- character stage: three-up test sheet --------------------------
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 1280x720 \
            res://game/tests/CharacterTest.tscn -- \
            --capture="$GITHUB_WORKSPACE/docs/screenshots" --capture-name=09_karakter \
            2>&1 | tee -a /tmp/capture.log | tail -20
          # --- character stage: the cast inside the diorama, day and night ---
          for variant in "dawn 17_pagi" "day 10_visual_siang" "dusk 18_sore" "night 11_visual_malam"; do
            set -- $variant
            xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
              "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 1280x720 \
              res://game/tests/VisualTest.tscn -- \
              --time="$1" --capture="$GITHUB_WORKSPACE/docs/screenshots" \
              --capture-name="$2" 2>&1 | tee -a /tmp/capture.log | tail -20
          done
          # --- character stage: the guard's parchment dialogue, and its fork --
          for variant in "page 12_dialog" "choices 13_pilihan" "after 15_dialog_setelah" "down 16_terjatuh"; do
            set -- $variant
            xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
              "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 1280x720 \
              res://game/tests/VisualTest.tscn -- \
              --dialog="$1" --capture="$GITHUB_WORKSPACE/docs/screenshots" \
              --capture-name="$2" 2>&1 | tee -a /tmp/capture.log | tail -20
          done
          # --- step 2: the nine named zones. Each shot teleports by MAP MARKER
          # NAME, so a rebuilt map cannot quietly point the camera at grass.
          for variant in \
            "Lembah Senja|30_zona_lembah" "Ladang Timur|31_zona_ladang" \
            "Hutan Pinus|32_zona_hutan" "Sungai Sedu|33_zona_sungai" \
            "Menara Penjaga|34_zona_menara" "Dataran Batu|35_zona_batu" \
            "Gua Berbisik|36_zona_gua" "Danau Cermin|37_zona_danau" \
            "Pos Gunung|38_zona_pos"; do
            key="${variant%%|*}"; name="${variant##*|}"
            xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
              "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 1280x720 \
              -- --hud=zone --zone="$key" --capture="$GITHUB_WORKSPACE/docs/screenshots" \
              --capture-name="$name" 2>&1 | tee -a /tmp/capture.log | tail -8
          done
          # --- step 2: the shapes a tiered world has to get right - stairs, a
          # cliff corner seen from both sides, water, and the same places near
          # and far, at noon and at dusk.
          for variant in \
            "stairs|39_tangga|sore|15" "cliff|40_tebing_luar|sore|18" \
            "cliff_inner|41_tebing_dalam|sore|18" "water|42_air_dekat|sore|14" \
            "Danau Cermin|43_danau_jauh|sore|30" "Lembah Senja|44_desa_siang|siang|17" \
            "Hutan Pinus|45_hutan_senja|sore|27"; do
            key="${variant%%|*}"; rest="${variant#*|}"
            name="${rest%%|*}"; rest="${rest#*|}"
            phase="${rest%%|*}"; zoom="${rest##*|}"
            xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
              "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 1280x720 \
              -- --hud=zone --zone="$key" --phase="$phase" --zoom="$zoom" \
              --capture="$GITHUB_WORKSPACE/docs/screenshots" \
              --capture-name="$name" 2>&1 | tee -a /tmp/capture.log | tail -8
          done
          # --- step 2: the full map, opened the way a player opens it
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 1280x720 \
            -- --hud=map --capture="$GITHUB_WORKSPACE/docs/screenshots" \
            --capture-name=46_peta_penuh 2>&1 | tee -a /tmp/capture.log | tail -8
          # --- step 3A: the village at the new octopath angle, and the knight
          # --- standing behind a tall prop (dither occlusion)
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 1280x720 \
            -- --hud=zone --zone="Lembah Senja" --phase=siang \
            --capture="$GITHUB_WORKSPACE/docs/screenshots" \
            --capture-name=47_kamera_desa 2>&1 | tee -a /tmp/capture.log | tail -8
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 1280x720 \
            -- --hud=occlusion --phase=sore \
            --capture="$GITHUB_WORKSPACE/docs/screenshots" \
            --capture-name=48_kamera_halangan 2>&1 | tee -a /tmp/capture.log | tail -8

          # --- step 3B: the building kit, four sides x day/night. The stage in
          # --- BuildingTest puts every kind on one plinth, so the shots are of
          # --- the kit and not of whatever happens to be behind it.
          mkdir -p "$GITHUB_WORKSPACE/docs/screenshots/bangunan"
          for phase in siang malam; do
            for side in depan kanan belakang kiri; do
              xvfb-run -a -s "-screen 0 640x360x24" env LIBGL_ALWAYS_SOFTWARE=1 \
                "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 640x360 \
                res://game/tests/BuildingTest.tscn -- \
                --view="$side" --time="$phase" \
                --capture="$GITHUB_WORKSPACE/docs/screenshots/bangunan" \
                --capture-name="50_bangunan_${side}_${phase}" \
                2>&1 | tee -a /tmp/capture.log | tail -4
            done
          done
          python3 -m venv /tmp/bsheetvenv >/dev/null
          /tmp/bsheetvenv/bin/pip install --quiet pillow
          /tmp/bsheetvenv/bin/python tools/building_sheet.py \
            --dir "$GITHUB_WORKSPACE/docs/screenshots/bangunan" \
            --out "$GITHUB_WORKSPACE/docs/screenshots/bangunan/kit_bangunan.png" \
            2>&1 | tee -a /tmp/capture.log | tail -3

          # --- step 3C: the battle itself. Ten states, each one a run of the real
          # --- BattleScene standing on the real region. 1280x720 so the interface
          # --- is readable in the PR; the arena is the field the fight started on.
          mkdir -p "$GITHUB_WORKSPACE/docs/screenshots/pertarungan"
          for state in dunia uji kamerasalin awal menu kelemahan boost break damage fase2 hasil kalah; do
            # the world-only reference frame is a diagnostic, not a deliverable:
            # half resolution keeps it out of the repository's budget
            extra=""
            case "$state" in dunia|uji|kamerasalin) extra="--capture-size=640x360";; esac
            xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
              "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 1280x720 \
              res://game/tests/BattleShot.tscn -- --state="$state" \
              --capture="$GITHUB_WORKSPACE/docs/screenshots/pertarungan" \
              --capture-name="51_pertarungan_${state}" $extra \
              2>&1 | tee -a /tmp/capture.log | tail -4
            # The frame is the evidence, but "no world / no fighters / wrong
            # camera" all look like the same grey rectangle. This line is what
            # the run reports when a shot comes out wrong.
            grep -h "^\[SHOT\]" /tmp/capture.log | tail -1 | sed 's/^/::warning::/' || true
            grep -h "^\[PROBE\]" /tmp/capture.log | tail -3 | sed 's/^/::notice::/' || true
            # Annotations are capped and deduplicated, which hid most of the
            # probe lines. The battle captures keep their own log next to the
            # PNGs, so the numbers survive the summary.
            grep -h -E "^\[(PROBE|DIAG|SHOT)\]" /tmp/capture.log | tail -n +1 \
              > "$GITHUB_WORKSPACE/docs/screenshots/pertarungan/probe.log" || true
          done

          # --- step 3A: pitch x FOV, the grid the owner picks the angle from.
          # --- 560x315 keeps eighteen shots small enough to live in the repo;
          # --- the lens values come from the command line, never from
          # --- camera.json, so no cell of this grid is a "setting".
          mkdir -p "$GITHUB_WORKSPACE/docs/screenshots/camera"
          for pitch in 25 30 35 40 50 38; do
            for fov in 25 32 40; do
              name=$(printf "p%02df%02d" "$pitch" "$fov")
              xvfb-run -a -s "-screen 0 560x315x24" env LIBGL_ALWAYS_SOFTWARE=1 \
                "$GITHUB_WORKSPACE/.tools/godot" --path game --resolution 560x315 \
                -- --hud=zone --zone="Lembah Senja" --phase=siang \
                --pitch="$pitch" --fov="$fov" \
                --capture="$GITHUB_WORKSPACE/docs/screenshots/camera" \
                --capture-name="$name" 2>&1 | tee -a /tmp/capture.log | tail -3
            done
          done
          python3 -m venv /tmp/sheetvenv >/dev/null
          /tmp/sheetvenv/bin/pip install --quiet pillow
          /tmp/sheetvenv/bin/python tools/camera_sheet.py \
            --dir docs/screenshots/camera \
            --out docs/screenshots/camera/sudut_kamera.png \
            --pitches 25,30,35,40,50,38 --fovs 25,32,40 \
            --recommend 30,32 --current 38,30 2>&1 | tee -a /tmp/capture.log | tail -3

          ls -la docs/screenshots

      - name: Publish capture log to the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          [ -z "$PR" ] && exit 0
          { echo "### capture log"; echo '```'; tail -c 20000 /tmp/capture.log 2>/dev/null || echo "(empty)"; echo '```'; } > /tmp/cap.md
          gh pr comment "$PR" --body-file /tmp/cap.md --repo "$GITHUB_REPOSITORY" || true

      - name: Commit screenshots
        # The branch is also pushed to by whoever is working; a rejected push
        # here must not turn a good capture into a red build.
        continue-on-error: true
        run: |
          set +e
          git config user.name "arena-ci"
          git config user.email "ci@arena.ai"
          git add -A docs/screenshots
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
            exit 0
          fi
          git commit -m "docs: tangkapan layar launcher (CI) [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && {
              echo "screenshots committed on attempt $attempt"; exit 0; }
            echo "push attempt $attempt rejected, retrying"; sleep 10
          done
          echo "could not push screenshots; they are still in the artifact"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-screenshots
          path: docs/screenshots/**/*.png
          if-no-files-found: warn

  # ----------------------------------------------------------------- apk ----
  android-apk:
    name: build launcher APK
    runs-on: ubuntu-latest
    needs: [launcher-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GITHUB_WORKSPACE/.tools"
          mv "$GITHUB_WORKSPACE/.tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GITHUB_WORKSPACE/.tools/godot"
          chmod +x "$GITHUB_WORKSPACE/.tools/godot"
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"

      - name: Install export templates
        run: |
          mkdir -p /tmp/tpl
          curl -sSL -o /tmp/tpl.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          cp -r /tmp/tpl/templates/* "$DEST"/
          ls "$DEST" | head

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (use the runner image's preinstalled SDK)
        continue-on-error: true
        run: |
          set +e
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ls "$SDK" || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true
          echo "--- platforms ---"; ls "$SDK/platforms" || true
          which apksigner || ls "$SDK"/build-tools/*/apksigner || true
          which zipalign || ls "$SDK"/build-tools/*/zipalign || true

      - name: Debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore /tmp/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Point Godot at the SDK (editor settings)
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          # strip the heredoc indentation so the .tres parses
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.7.tres"
          cat "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Export APK
        env:
          GH_TOKEN: ${{ github.token }}
          # Godot resolves the release keystore from the environment first
          # (EditorExportPreset::get_or_env), so the preset file stays clean.
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          set +e
          : > /tmp/apk.log
          timeout 240 godot --headless --path launcher --import >> /tmp/apk.log 2>&1
          mkdir -p dist
          godot --headless --path launcher --export-debug "Android" \
            "$PWD/dist/re-traveller-launcher-debug.apk" >> /tmp/apk.log 2>&1
          godot --headless --path launcher --export-release "Android" \
            "$PWD/dist/re-traveller-launcher.apk" >> /tmp/apk.log 2>&1
          code=$?
          APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | tail -1)
          for apk in dist/re-traveller-launcher-debug.apk dist/re-traveller-launcher.apk; do
            if [ ! -f "$apk" ]; then echo "MISSING $apk" >> /tmp/apk.log; code=1; continue; fi
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$apk" >> /tmp/apk.log 2>&1
              v=$?
              echo "apksigner verify $apk exit=$v" >> /tmp/apk.log
              [ $v -ne 0 ] && code=1
            fi
          done
          tail -60 /tmp/apk.log
          ls -la dist >> /tmp/apk.log

          # Prove the APK was built from this commit: build_id lives in
          # project.godot and ends up inside assets/project.binary, so a stale
          # or wrong artifact fails here instead of being published.
          python3 - <<'PYEOF' 2>&1 | tee -a /tmp/apk.log
          import glob, re, sys, zipfile
          src = open("launcher/project.godot", encoding="utf-8").read()
          m = re.search(r'^build_id="([^"]+)"', src, re.M)
          if not m:
              sys.exit("project.godot has no [re_traveller] build_id")
          marker = m.group(1).encode()
          apks = sorted(glob.glob("dist/*.apk"))
          if not apks:
              sys.exit("no APK produced")
          failed = False
          for apk in apks:
              hit = False
              where = ""
              with zipfile.ZipFile(apk) as z:
                  for info in z.infolist():
                      if hit or info.file_size > 80 * 1024 * 1024:
                          continue
                      try:
                          if marker in z.read(info):
                              hit = True
                              where = info.filename
                      except Exception:
                          pass
              print("BUILD_ID %s in %s: %s %s" % (marker.decode(), apk, hit, where))
              failed = failed or not hit
          sys.exit(1 if failed else 0)
          PYEOF
          [ ${PIPESTATUS[0]} -ne 0 ] && code=1

          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$PR" ]; then
            { echo "### APK export log (exit $code)"; echo '```'; tail -c 60000 /tmp/apk.log; echo '```'; } > /tmp/apk.md
            gh pr comment "$PR" --body-file /tmp/apk.md --repo "$GITHUB_REPOSITORY" || true
          fi
          exit $code

      - name: Publish APK log to the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # on a pull_request run GITHUB_REF_NAME is "3319839a/merge", not the branch,
          # so the log comment silently went nowhere; GITHUB_HEAD_REF is the branch
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          [ -z "$PR" ] && exit 0
          { echo "### APK job log"; echo '```'; tail -c 40000 /tmp/apk.log 2>/dev/null || echo "(no export log)"; echo '```'; } > /tmp/apk2.md
          gh pr comment "$PR" --body-file /tmp/apk2.md --repo "$GITHUB_REPOSITORY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: re-traveller-launcher-apk
          path: dist/*.apk
          if-no-files-found: warn
