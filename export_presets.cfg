[preset.0]

name="Android (arm64-v8a Release/Debug)"
platform="Android"
runnable=true
dedicated_server=false
custom_features="mobile,android"
export_filter="all_resources"
include_filter="*.csv,*.json,*.tres,*.tscn,*.gd,*.gdshader,*.png,*.wav"
exclude_filter=""
export_path="build/LANTERNFALL_Part1_arm64.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
# Non-gradle (legacy) export: cuma butuh export template + apksigner,
# tanpa Android Gradle Plugin → build APK jauh lebih cepat & stabil di CI.
# Untuk AAB / upload ke Google Play, setel kembali ke `true`
# lalu install Android build template (Project > Install Android Build Template).
gradle_build/use_gradle_build=false
gradle_build/export_format=0
gradle_build/min_sdk="24"
gradle_build/target_sdk="34"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="id.rembangstudio.lanternfall"
package/name="LANTERNFALL"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
keystore/debug="res://android/keystore/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
keystore/release=""
keystore/release_user=""
keystore/release_password=""
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
xr_features/xr_mode=0
permissions/internet=false
permissions/vibrate=true
