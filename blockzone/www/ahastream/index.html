<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aha Stream — Watch Anime Together</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090a10;
      --surface: #11131f;
      --surface-2: #181b2c;
      --surface-hover: #22263d;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.35);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(139, 92, 246, 0.3);
      --radius: 14px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      padding-bottom: 40px;
    }

    /* Ambient background lights */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.25;
    }
    .orb-1 {
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: var(--accent);
    }
    .orb-2 {
      top: 30%;
      right: -150px;
      width: 350px;
      height: 350px;
      background: var(--cyan);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 20px;
    }

    /* Top Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0 20px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .brand-logo svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }
    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 40%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(6, 182, 212, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    /* Search Bar */
    .search-box {
      flex: 1;
      max-width: 460px;
      position: relative;
    }
    .search-input {
      width: 100%;
      height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 16px 0 42px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
    }
    .search-input:focus {
      border-color: var(--accent);
      background: var(--surface-2);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Hero Spotlight */
    .hero-banner {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .hero-img-wrap {
      position: relative;
      height: 280px;
      width: 100%;
      overflow: hidden;
    }
    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      transition: transform 0.6s ease;
    }
    .hero-banner:hover .hero-img {
      transform: scale(1.03);
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, var(--surface) 10%, rgba(17,19,31,0.7) 50%, transparent 100%);
    }
    .hero-content {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
    }
    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 8px;
    }
    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }
    .hero-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .meta-pill {
      background: rgba(255,255,255,0.1);
      padding: 2px 8px;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
    }

    /* Category Filter */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar {
      display: none;
    }
    .filter-chip {
      padding: 8px 16px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .filter-chip:hover {
      background: var(--surface-hover);
      color: #fff;
    }
    .filter-chip.active {
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    /* Anime Grid */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: '';
      display: block;
      width: 4px;
      height: 18px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--accent), var(--cyan));
    }

    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }
    @media (min-width: 640px) {
      .anime-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
      }
    }

    .anime-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }
    .anime-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-accent);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--surface-2);
      overflow: hidden;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .anime-card:hover .card-thumb {
      transform: scale(1.06);
    }
    .card-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(9, 10, 16, 0.85);
      backdrop-filter: blur(6px);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }
    .card-score {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(9, 10, 16, 0.85);
      backdrop-filter: blur(6px);
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 6px;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-genre {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal Player */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }
    .modal-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      transform: scale(0.96);
      transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-container {
      transform: scale(1);
    }
    .modal-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }
    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .modal-close:hover {
      background: #ef4444;
      color: #fff;
    }
    .player-frame-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .player-frame-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      background: #06070a;
    }
    .play-btn-large {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px var(--accent-glow);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .play-btn-large:hover {
      transform: scale(1.1);
    }
    .play-btn-large svg {
      width: 28px;
      height: 28px;
      fill: #fff;
      margin-left: 3px;
    }

    .modal-body {
      padding: 20px;
    }
    .episodes-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--cyan);
    }
    .episodes-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .ep-btn {
      height: 38px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ep-btn:hover {
      background: var(--surface-hover);
      border-color: var(--cyan);
    }
    .ep-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      color: #fff;
      border: none;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    /* Loading state */
    .loading-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 14px;
    }
    .spin {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand" onclick="resetFilter()">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="brand-name">Aha Stream</span>
            <span class="brand-badge">Discord</span>
          </div>
        </div>
      </div>

      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Cari judul anime atau genre..." autocomplete="off">
      </div>
    </header>

    <!-- Hero Spotlight -->
    <div id="heroBanner" class="hero-banner" style="display:none;">
      <div class="hero-img-wrap">
        <img id="heroImg" class="hero-img" src="" alt="Hero Spotlight">
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <div class="hero-tag">🔥 Trending Hari Ini</div>
          <h2 id="heroTitle" class="hero-title"></h2>
          <div class="hero-meta">
            <span id="heroType" class="meta-pill">TV</span>
            <span id="heroScore">⭐ 9.0</span>
            <span id="heroYear">2026</span>
            <span id="heroGenres">Action, Fantasy</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <button class="filter-chip active" onclick="setCategory('ALL')">Semua Anime</button>
      <button class="filter-chip" onclick="setCategory('Action')">Action</button>
      <button class="filter-chip" onclick="setCategory('Fantasy')">Fantasy</button>
      <button class="filter-chip" onclick="setCategory('Romance')">Romance</button>
      <button class="filter-chip" onclick="setCategory('Comedy')">Comedy</button>
      <button class="filter-chip" onclick="setCategory('Supernatural')">Supernatural</button>
      <button class="filter-chip" onclick="setCategory('Adventure')">Adventure</button>
      <button class="filter-chip" onclick="setCategory('Drama')">Drama</button>
    </div>

    <!-- Grid List -->
    <div class="section-head">
      <div class="section-title" id="gridTitle">Katalog Populer</div>
      <span id="animeCount" style="font-size:12px; color:var(--text-muted);">Memuat...</span>
    </div>

    <div id="animeGrid" class="anime-grid">
      <!-- Loading indicator -->
      <div class="loading-spinner" style="grid-column: 1 / -1;">
        <div class="spin"></div>
        <span>Menyiapkan katalog Aha Stream...</span>
      </div>
    </div>
  </div>

  <!-- Video Player Modal -->
  <div id="playerModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Menonton Anime</div>
        <button class="modal-close" onclick="closePlayerModal()">✕</button>
      </div>

      <div class="player-frame-box">
        <div id="playerPlaceholder" class="player-placeholder">
          <div class="play-btn-large" id="playTrigger">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <span style="font-size:13px; font-weight:600;">Klik untuk memulai streaming</span>
        </div>
        <iframe id="videoIframe" src="" allow="autoplay; fullscreen" style="display:none;"></iframe>
      </div>

      <div class="modal-body">
        <div class="episodes-title">Pilih Episode:</div>
        <div class="episodes-list" id="episodesList">
          <!-- Tombol episode -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let catalog = [];
    let currentCategory = 'ALL';
    let activeAnime = null;
    let activeEpisode = 1;

    // Load Catalog Data
    async function loadCatalog() {
      try {
        const res = await fetch('https://anikai.org/catalog-index.json');
        catalog = await res.json();
        
        // Render Spotlight
        renderHero();
        // Render Grid
        renderGrid();
      } catch (err) {
        document.getElementById('animeGrid').innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">
            ⚠️ Gagal memuat katalog anime. Silakan muat ulang.
          </div>
        `;
      }
    }

    function renderHero() {
      if (!catalog || catalog.length === 0) return;
      // Cari anime unggulan
      const hero = catalog.find(x => x.y >= 2025 && (x.sc >= 8.0 || x.sc >= 7.5)) || catalog[0];
      if (!hero) return;

      const heroBanner = document.getElementById('heroBanner');
      const heroImg = document.getElementById('heroImg');
      const heroTitle = document.getElementById('heroTitle');
      const heroType = document.getElementById('heroType');
      const heroScore = document.getElementById('heroScore');
      const heroYear = document.getElementById('heroYear');
      const heroGenres = document.getElementById('heroGenres');

      heroImg.src = `https://img.anikai.org/hero/w_900/h_540/${hero.s}.webp`;
      heroImg.onerror = () => { heroImg.src = `https://img.anikai.org/poster/w_360/h_480/${hero.s}.webp`; };
      heroTitle.textContent = hero.n;
      heroType.textContent = hero.f || 'TV';
      heroScore.textContent = hero.sc ? `⭐ ${hero.sc}` : '⭐ 8.5';
      heroYear.textContent = hero.y || '2026';
      heroGenres.textContent = (hero.g || []).slice(0, 3).join(', ');

      heroBanner.onclick = () => openAnime(hero);
      heroBanner.style.display = 'block';
    }

    function renderGrid() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const grid = document.getElementById('animeGrid');
      
      let filtered = catalog;

      // Filter Category
      if (currentCategory !== 'ALL') {
        filtered = filtered.filter(x => (x.g || []).includes(currentCategory));
      }

      // Filter Search
      if (search) {
        filtered = filtered.filter(x => 
          (x.n && x.n.toLowerCase().includes(search)) ||
          (x.j && x.j.toLowerCase().includes(search))
        );
      }

      document.getElementById('animeCount').textContent = `${filtered.length} anime`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align:center; padding:50px 20px; color:var(--text-muted);">
            🔍 Tidak ada anime yang cocok dengan kata kunci "<b>${search}</b>".
          </div>
        `;
        return;
      }

      // Tampilkan 60 anime teratas agar ringan & cepat
      const items = filtered.slice(0, 60);

      grid.innerHTML = items.map(anime => `
        <div class="anime-card" onclick="openAnimeById(${anime.i})">
          <div class="card-thumb-wrap">
            <img class="card-thumb" src="https://img.anikai.org/poster/w_360/h_480/${anime.s}.webp" loading="lazy" alt="${anime.n}">
            <div class="card-badge">${anime.f || 'TV'}</div>
            <div class="card-score">⭐ ${anime.sc || '-'}</div>
          </div>
          <div class="card-info">
            <div class="card-title" title="${anime.n}">${anime.n}</div>
            <div class="card-genre">${(anime.g || []).slice(0, 2).join(' • ')}</div>
          </div>
        </div>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === (cat === 'ALL' ? 'Semua Anime' : cat));
      });
      renderGrid();
    }

    function resetFilter() {
      currentCategory = 'ALL';
      document.getElementById('searchInput').value = '';
      setCategory('ALL');
    }

    // Search input listener
    document.getElementById('searchInput').addEventListener('input', () => {
      renderGrid();
    });

    function openAnimeById(id) {
      const anime = catalog.find(x => x.i === id);
      if (anime) openAnime(anime);
    }

    function openAnime(anime) {
      activeAnime = anime;
      activeEpisode = 1;

      document.getElementById('modalTitle').textContent = anime.n;
      document.getElementById('playerModal').classList.add('active');

      // Setup episode list (default 12 sampai 24 ep)
      const totalEp = anime.tt || 12;
      const epList = document.getElementById('episodesList');
      epList.innerHTML = '';

      for (let i = 1; i <= Math.min(totalEp, 24); i++) {
        const btn = document.createElement('button');
        btn.className = `ep-btn ${i === 1 ? 'active' : ''}`;
        btn.textContent = `EP ${i}`;
        btn.onclick = () => selectEpisode(i, btn);
        epList.appendChild(btn);
      }

      // Reset iframe state
      const iframe = document.getElementById('videoIframe');
      const placeholder = document.getElementById('playerPlaceholder');
      iframe.style.display = 'none';
      iframe.src = '';
      placeholder.style.display = 'flex';

      document.getElementById('playTrigger').onclick = () => {
        startStreaming();
      };
    }

    function selectEpisode(ep, btn) {
      activeEpisode = ep;
      document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      startStreaming();
    }

    function startStreaming() {
      if (!activeAnime) return;
      const iframe = document.getElementById('videoIframe');
      const placeholder = document.getElementById('playerPlaceholder');

      placeholder.style.display = 'none';
      iframe.style.display = 'block';

      // Load player via Discord Activities Proxy domain
      iframe.src = `https://anikai.org/watch/${activeAnime.s}/`;
    }

    function closePlayerModal() {
      const modal = document.getElementById('playerModal');
      const iframe = document.getElementById('videoIframe');
      iframe.src = '';
      modal.classList.remove('active');
    }

    // Close on click outside modal
    document.getElementById('playerModal').addEventListener('click', (e) => {
      if (e.target.id === 'playerModal') {
        closePlayerModal();
      }
    });

    // Jalankan pertama kali
    loadCatalog();
  </script>
</body>
</html>
