<!doctype html>
<html lang="en" data-theme="dark" data-image-host="https://img.anikai.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Aha Stream — Watch Anime Series, Movies & Latest Updates</title>
  <meta name="theme-color" content="#0c1116">
  
  <!-- Fonts Poppins & Icons persis Anikai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1116;
      --surface: #11161b;
      --panel: #151a20;
      --control: #1d242c;
      --control-hover: #262e38;
      --muted: #a0a3a6;
      --text: #e1e2e3;
      --orange: #e45f3a;
      --orange-hover: #f47750;
      --orange-text: #10151a;
      --green: #36cb68;
      --border: rgba(255, 255, 255, 0.08);
      --site-max-width: 2200px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      padding-bottom: 50px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header Nav Bar persis AniKai */
    #home-header {
      position: absolute;
      top: 13px;
      inset-x: 0;
      z-index: 30;
      width: 100%;
    }
    @media (min-width: 640px) {
      #home-header {
        top: 20px;
      }
    }

    .header-bar {
      position: relative;
      margin: 0 auto;
      display: flex;
      height: 60px;
      width: calc(100% - 24px);
      max-width: var(--site-max-width);
      align-items: center;
      gap: 12px;
      border-radius: 12px;
      background: rgba(21, 26, 32, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 0 16px;
    }
    @media (min-width: 640px) {
      .header-bar {
        height: 64px;
        width: 94.5%;
        padding: 0 24px;
        gap: 24px;
      }
    }

    .brand-logo-link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 10px var(--orange);
    }
    .brand-text {
      letter-spacing: -0.5px;
    }
    .brand-text span {
      color: var(--orange);
    }

    /* Search Box */
    .search-wrap {
      flex: 1;
      max-width: 440px;
      position: relative;
      margin-left: auto;
    }
    .search-input {
      width: 100%;
      height: 40px;
      background: var(--control);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 14px 0 38px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--orange);
      background: var(--control-hover);
    }
    .search-icon-svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }

    /* Hero Spotlight Carousel persis Anikai */
    .hero {
      position: relative;
      height: 520px;
      overflow: hidden;
      background: var(--bg);
      cursor: pointer;
    }
    @media (min-width: 640px) {
      .hero {
        height: 580px;
      }
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .hero-art {
      position: absolute;
      top: 0;
      right: 0;
      width: 85%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      opacity: 0.85;
      transition: transform 0.6s ease;
    }
    .hero:hover .hero-art {
      transform: scale(1.02);
    }
    .hero-slide::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: 
        linear-gradient(90deg, var(--bg) 5%, rgba(12, 17, 22, 0.9) 25%, rgba(12, 17, 22, 0.3) 65%, rgba(12, 17, 22, 0.5)),
        linear-gradient(0deg, var(--bg) 0%, rgba(12, 17, 22, 0) 65%);
    }

    .site-container {
      position: relative;
      z-index: 10;
      width: calc(100% - 24px);
      max-width: var(--site-max-width);
      margin: 0 auto;
      height: 100%;
      display: flex;
      align-items: center;
    }
    @media (min-width: 640px) {
      .site-container {
        width: 94.5%;
      }
    }

    .hero-detail {
      width: 100%;
      max-width: 680px;
      padding-top: 60px;
    }
    .hero-title {
      font-size: 26px;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 14px;
      color: #fff;
    }
    @media (min-width: 640px) {
      .hero-title {
        font-size: 34px;
      }
    }
    .hero-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .episode-badge {
      color: var(--orange);
      border: 1px solid var(--orange);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .hero-description {
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .watch-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--orange);
      color: var(--orange-text);
      font-weight: 600;
      font-size: 14px;
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .watch-button:hover {
      background: var(--orange-hover);
    }
    .watch-button svg {
      fill: currentColor;
    }

    /* Main Content Layout */
    .content-wrapper {
      position: relative;
      z-index: 10;
      width: calc(100% - 24px);
      max-width: var(--site-max-width);
      margin: 20px auto 0 auto;
    }
    @media (min-width: 640px) {
      .content-wrapper {
        width: 94.5%;
      }
    }

    /* Genre filter pills */
    .genres-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 24px;
      scrollbar-width: none;
    }
    .genres-nav::-webkit-scrollbar {
      display: none;
    }
    .genre-pill {
      background: var(--control);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .genre-pill:hover {
      background: var(--control-hover);
      color: #fff;
    }
    .genre-pill.active {
      background: var(--orange);
      color: var(--orange-text);
      font-weight: 600;
    }

    /* Section Heading */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: "";
      width: 4px;
      height: 18px;
      background: var(--orange);
      border-radius: 2px;
      display: inline-block;
    }

    /* Anime Grid persis Anikai */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      row-gap: 24px;
    }
    @media (min-width: 576px) {
      .anime-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        row-gap: 26px;
      }
    }
    @media (min-width: 992px) {
      .anime-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 18px;
        row-gap: 28px;
      }
    }

    /* Card Item persis class .anime-card anikai */
    .anime-card {
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .poster-link {
      aspect-ratio: 3 / 4;
      background: var(--control);
      border-radius: 10px;
      display: block;
      position: relative;
      overflow: hidden;
    }
    .poster-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.2s, transform 0.2s;
      background: #151a20;
    }
    .anime-card:hover .poster-link img {
      opacity: 0.85;
      transform: scale(1.03);
    }
    .card-play {
      opacity: 0;
      color: #fff;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
      background: rgba(0, 0, 0, 0.3);
    }
    .card-play-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-play-icon svg {
      fill: var(--orange-text);
      width: 20px;
      height: 20px;
      margin-left: 2px;
    }
    .anime-card:hover .card-play {
      opacity: 1;
    }

    .card-title {
      font-size: 14px;
      line-height: 20px;
      margin-top: 10px;
      margin-bottom: 6px;
      font-weight: 500;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 40px;
    }
    .card-title:hover {
      color: var(--orange);
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .card-format {
      text-transform: uppercase;
    }

    /* Modal Player persis anikai watch section */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 960px;
      max-height: 92vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }
    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--control);
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .modal-close:hover {
      background: var(--orange);
      color: var(--orange-text);
    }

    .player-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .player-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .player-starter {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #080c0f;
    }
    .play-btn-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .play-btn-circle:hover {
      transform: scale(1.1);
    }
    .play-btn-circle svg {
      fill: var(--orange-text);
      width: 26px;
      height: 26px;
      margin-left: 3px;
    }

    .episodes-panel {
      padding: 20px;
    }
    .episodes-header {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .ep-item {
      height: 36px;
      background: var(--control);
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ep-item:hover {
      background: var(--control-hover);
      color: #fff;
    }
    .ep-item.active {
      background: var(--orange);
      color: var(--orange-text);
      font-weight: 600;
    }

    /* Fallback poster inline SVG bila gambar gagal load */
    .img-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: var(--control);
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      padding: 8px;
    }
  </style>
</head>
<body>
  <!-- Header Bar -->
  <header id="home-header">
    <div class="header-bar">
      <div class="brand-logo-link" onclick="resetFilter()">
        <div class="brand-dot"></div>
        <div class="brand-text">Aha<span>Stream</span></div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search anime..." autocomplete="off">
      </div>
    </div>
  </header>

  <!-- Hero Spotlight Section -->
  <section class="hero" id="heroBanner" style="display:none;">
    <article class="hero-slide">
      <img id="heroImg" class="hero-art" src="" alt="Hero anime art" referrerpolicy="no-referrer">
      <div class="site-container">
        <div class="hero-detail">
          <h2 id="heroTitle" class="hero-title"></h2>
          <div class="hero-info">
            <span id="heroEp" class="episode-badge">EP 7</span>
            <span id="heroType">TV</span>
            <span id="heroGenres">Action, Adventure</span>
            <span id="heroScore">⭐ 9.1</span>
          </div>
          <p id="heroDesc" class="hero-description">Discover featured anime, recent episode updates, new releases and completed series on Aha Stream.</p>
          <div class="watch-button" id="heroWatchBtn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path d="m8 4 13 8-13 8z"/></svg>
            <span>Watch Now</span>
          </div>
        </div>
      </div>
    </article>
  </section>

  <!-- Content Section -->
  <main class="content-wrapper">
    <!-- Genre Filter Navigation -->
    <div class="genres-nav">
      <button class="genre-pill active" onclick="setCategory('ALL')">All</button>
      <button class="genre-pill" onclick="setCategory('Action')">Action</button>
      <button class="genre-pill" onclick="setCategory('Adventure')">Adventure</button>
      <button class="genre-pill" onclick="setCategory('Fantasy')">Fantasy</button>
      <button class="genre-pill" onclick="setCategory('Romance')">Romance</button>
      <button class="genre-pill" onclick="setCategory('Comedy')">Comedy</button>
      <button class="genre-pill" onclick="setCategory('Supernatural')">Supernatural</button>
      <button class="genre-pill" onclick="setCategory('Drama')">Drama</button>
      <button class="genre-pill" onclick="setCategory('Mystery')">Mystery</button>
    </div>

    <!-- Section Heading -->
    <div class="section-head">
      <div class="section-title" id="gridHeading">Latest Updates</div>
      <span id="gridCount" style="font-size:12px; color:var(--muted);">Loading...</span>
    </div>

    <!-- Anime Grid persis AniKai -->
    <div id="latest-grid" class="anime-grid">
      <div style="grid-column: 1 / -1; text-align:center; padding: 40px 0; color:var(--muted);">
        Loading catalog...
      </div>
    </div>
  </main>

  <!-- Modal Watch Player -->
  <div id="watchModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="playerTitle">Anime Player</div>
        <button class="modal-close" onclick="closePlayer()">✕</button>
      </div>

      <div class="player-box">
        <div id="playerStarter" class="player-starter">
          <div class="play-btn-circle" id="startBtn">
            <svg viewBox="0 0 24 24"><path d="m8 4 13 8-13 8z"/></svg>
          </div>
          <span style="font-size:13px; color:var(--muted);">Click to stream episode</span>
        </div>
        <iframe id="streamIframe" src="" allow="autoplay; fullscreen" style="display:none;"></iframe>
      </div>

      <div class="episodes-panel">
        <div class="episodes-header">
          <span class="episode-badge" id="playerBadge">EP 1</span>
          <span>Episodes</span>
        </div>
        <div class="episodes-grid" id="episodesGrid"></div>
      </div>
    </div>
  </div>

  <script>
    let catalog = [];
    let activeCategory = 'ALL';
    let currentAnime = null;
    let selectedEp = 1;

    // Helper membuat URL poster dengan fallback multi-source
    function getPosterUrl(slug) {
      // Direct origin anikai.org dengan no-referrer
      return `https://img.anikai.org/poster/w_360/h_480/${slug}.webp`;
    }

    function getHeroUrl(slug) {
      return `https://img.anikai.org/hero/w_900/h_540/${slug}.webp`;
    }

    // Load Catalog
    async function loadCatalog() {
      try {
        let res;
        try {
          res = await fetch('./catalog.json');
        } catch {
          res = await fetch('https://anikai.org/catalog-index.json');
        }
        if (!res.ok) {
          res = await fetch('https://anikai.org/catalog-index.json');
        }
        catalog = await res.json();
        
        initHero();
        renderGrid();
      } catch (err) {
        document.getElementById('latest-grid').innerHTML = `
          <div style="grid-column: 1 / -1; text-align:center; padding: 40px; color:var(--muted);">
            ⚠️ Failed to load catalog. Please refresh.
          </div>
        `;
      }
    }

    function initHero() {
      if (!catalog || catalog.length === 0) return;
      const hero = catalog.find(x => x.y >= 2025 && (x.sc >= 8.5 || x.sc >= 7.5)) || catalog[0];
      if (!hero) return;

      const banner = document.getElementById('heroBanner');
      const img = document.getElementById('heroImg');
      
      img.src = getHeroUrl(hero.s);
      img.onerror = () => {
        img.src = `https://images.weserv.nl/?url=img.anikai.org/hero/w_900/h_540/${hero.s}.webp&output=webp`;
        img.onerror = () => { img.src = getPosterUrl(hero.s); };
      };

      document.getElementById('heroTitle').textContent = hero.n;
      document.getElementById('heroEp').textContent = `EP ${hero.tt || 12}`;
      document.getElementById('heroType').textContent = hero.f || 'TV';
      document.getElementById('heroGenres').textContent = (hero.g || []).slice(0, 3).join(', ');
      document.getElementById('heroScore').textContent = hero.sc ? `⭐ ${hero.sc}` : '⭐ 8.8';

      banner.onclick = () => openWatch(hero);
      banner.style.display = 'block';
    }

    function renderGrid() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const grid = document.getElementById('latest-grid');
      
      let list = catalog;

      if (activeCategory !== 'ALL') {
        list = list.filter(x => (x.g || []).includes(activeCategory));
      }

      if (search) {
        list = list.filter(x => 
          (x.n && x.n.toLowerCase().includes(search)) ||
          (x.j && x.j.toLowerCase().includes(search))
        );
      }

      document.getElementById('gridCount').textContent = `${list.length} anime`;

      if (list.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align:center; padding: 50px 20px; color:var(--muted);">
            🔍 No anime found for "<b>${search}</b>".
          </div>
        `;
        return;
      }

      // Tampilkan 60 kartu dengan format markup persis Anikai
      const items = list.slice(0, 60);

      grid.innerHTML = items.map(anime => `
        <article class="anime-card" onclick="openWatchById(${anime.i})">
          <a class="poster-link" tabindex="-1" aria-hidden="true">
            <img 
              src="${getPosterUrl(anime.s)}" 
              srcset="https://img.anikai.org/poster-sm/w_200/h_267/${anime.s}.webp 200w, https://img.anikai.org/poster-md/w_300/h_400/${anime.s}.webp 300w, https://img.anikai.org/poster/w_360/h_480/${anime.s}.webp 360w"
              sizes="(max-width: 575px) calc((100vw - 39px) / 2), (max-width: 991px) calc((94.52vw - 42px) / 4), calc((min(94.52vw, 2200px) - 512px) / 6)"
              alt="${anime.n}" 
              loading="lazy" 
              decoding="async"
              referrerpolicy="no-referrer"
              onerror="this.onerror=null; this.src='https://images.weserv.nl/?url=img.anikai.org/poster/w_360/h_480/${anime.s}.webp&output=webp';"
            >
            <span class="card-play">
              <span class="card-play-icon">
                <svg viewBox="0 0 24 24"><path d="m8 4 13 8-13 8z"/></svg>
              </span>
            </span>
          </a>
          <h3 class="card-title">${anime.n}</h3>
          <div class="card-meta">
            <span class="episode-badge" aria-label="${anime.tt || 12} episodes">EP ${anime.tt || 12}</span>
            <span>${anime.y || 2026}</span>
            <span class="card-format">${anime.f || 'TV'}</span>
          </div>
        </article>
      `).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.genre-pill').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === (cat === 'ALL' ? 'All' : cat));
      });
      renderGrid();
    }

    function resetFilter() {
      activeCategory = 'ALL';
      document.getElementById('searchInput').value = '';
      setCategory('ALL');
    }

    document.getElementById('searchInput').addEventListener('input', () => {
      renderGrid();
    });

    function openWatchById(id) {
      const anime = catalog.find(x => x.i === id);
      if (anime) openWatch(anime);
    }

    function openWatch(anime) {
      currentAnime = anime;
      selectedEp = 1;

      document.getElementById('playerTitle').textContent = anime.n;
      document.getElementById('playerBadge').textContent = `EP 1`;
      document.getElementById('watchModal').classList.add('active');

      const total = anime.tt || 12;
      const grid = document.getElementById('episodesGrid');
      grid.innerHTML = '';

      for (let i = 1; i <= Math.min(total, 24); i++) {
        const btn = document.createElement('button');
        btn.className = `ep-item ${i === 1 ? 'active' : ''}`;
        btn.textContent = `EP ${i}`;
        btn.onclick = () => {
          selectedEp = i;
          document.querySelectorAll('.ep-item').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('playerBadge').textContent = `EP ${i}`;
          startPlayer();
        };
        grid.appendChild(btn);
      }

      const starter = document.getElementById('playerStarter');
      const iframe = document.getElementById('streamIframe');
      iframe.style.display = 'none';
      iframe.src = '';
      starter.style.display = 'flex';

      document.getElementById('startBtn').onclick = () => startPlayer();
    }

    function startPlayer() {
      if (!currentAnime) return;
      const starter = document.getElementById('playerStarter');
      const iframe = document.getElementById('streamIframe');
      starter.style.display = 'none';
      iframe.style.display = 'block';
      iframe.src = `https://anikai.org/watch/${currentAnime.s}/`;
    }

    function closePlayer() {
      const modal = document.getElementById('watchModal');
      const iframe = document.getElementById('streamIframe');
      iframe.src = '';
      modal.classList.remove('active');
    }

    document.getElementById('watchModal').addEventListener('click', (e) => {
      if (e.target.id === 'watchModal') closePlayer();
    });

    loadCatalog();
  </script>
</body>
</html>
